<title>Ledger — Daily Money Log</title>

<style>

    --bg: #F3F4FA; --surface: #FFFFFF; --ink: #14161F; --ink-soft: #767B8C;
    --line: #E7E8F2; --brand: #3D5AFE; --income: #17B890; --expense: #FF5D5D; --warn: #FFB020;

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 96px; }

  .centered { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .loading-mark { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.15em; color: var(--ink-soft); }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 8px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: #fff; background: var(--brand); border-radius: 8px; padding: 5px 7px; }

  .brand .sub { margin: 1px 0 0; font-size: 11.5px; color: var(--ink-soft); }

  .save-pill.saving { color: var(--brand); }

  .balance-block { margin: 6px 20px 0; padding: 22px 20px; background: var(--surface); border: none; border-radius: 20px; box-shadow: 0 6px 24px rgba(20,22,31,0.06); }
  .balance-main { display: flex; flex-direction: column; gap: 2px; }
  .balance-main .label { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }
  .balance-figure { font-family: 'Space Grotesk', sans-serif; font-size: 33px; font-weight: 700; letter-spacing: -0.01em; }
  .balance-figure.neg { color: var(--expense); }
  .balance-stats { display: flex; gap: 14px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .stat { display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-soft); }
  .stat svg { display: block; }
  .stat.income svg { color: var(--income); }
  .stat.expense svg { color: var(--expense); }
  .stat.net { margin-left: auto; color: var(--ink); font-weight: 500; }
  .stat.net.neg { color: var(--expense); }
  .stat.net.pos { color: var(--income); }

  .month-scroll { display: flex; gap: 8px; padding: 16px 20px 4px; overflow-x: auto; scrollbar-width: none; }
  .month-scroll::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  .filter-banner { display: flex; align-items: center; justify-content: space-between; margin: 10px 20px 0; padding: 8px 12px; background: #EDEFFC; border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; }
  .filter-banner button { background: none; border: none; color: var(--ink-soft); cursor: pointer; display: flex; }

  .tabs { display: flex; gap: 4px; margin: 14px 20px 0; border-bottom: 1px solid var(--line); }
  .tab { font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 500; padding: 10px 4px; margin-right: 18px; background: none; border: none; color: var(--ink-soft); border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: var(--ink); border-bottom-color: var(--brand); }

  .content { padding: 6px 20px 20px; }
  .empty { color: var(--ink-soft); font-size: 13px; text-align: center; padding: 40px 10px; }
  .hint, .panel-hint { color: var(--ink-soft); font-size: 11px; margin: 10px 0 0; }
  .panel-hint { margin: -6px 0 12px; }

  .day-group { margin-top: 18px; }
  .day-heading { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 6px; }

  .row-wrap { position: relative; overflow: hidden; border-radius: 12px; }
  .row-delete-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; background: var(--expense); color: #fff; }
  .row { position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 12px 4px; background: var(--surface); touch-action: pan-y; cursor: pointer; user-select: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; justify-content: space-between; gap: 10px; }
  .row-title { font-size: 14px; font-weight: 500; }
  .row-amount { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; color: var(--expense); flex: none; }
  .row-amount.pos { color: var(--income); }
  .row-desc { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .row-delete-btn { background: none; border: none; color: var(--line); cursor: pointer; padding: 4px; margin-top: 2px; }
  .row-delete-btn:hover { color: var(--expense); }

  .overview { display: flex; flex-direction: column; gap: 20px; }
  .panel { background: var(--surface); border: none; border-radius: 18px; padding: 18px 18px 14px; box-shadow: 0 6px 24px rgba(20,22,31,0.05); }
  .panel h2 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; margin: 0 0 2px; }

  .cat-bars { display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px; }
  .cat-item { padding: 8px 0; border-bottom: 1px solid var(--line); }

  .cat-row { display: grid; grid-template-columns: 90px 1fr 68px; align-items: center; gap: 8px; }
  .cat-name { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-soft); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  .cat-name svg { opacity: 0.5; }
  .cat-track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; cursor: pointer; }
  .cat-fill { height: 100%; border-radius: 4px; }
  .cat-total { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-align: right; }
  .budget-line { font-size: 10.5px; color: var(--ink-soft); margin-top: 4px; margin-left: 98px; }
  .budget-line.warn { color: var(--warn); }
  .budget-line.over { color: var(--expense); }
  .budget-editor { display: flex; gap: 6px; margin-top: 8px; margin-left: 98px; }
  .budget-editor input { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .mini-btn { font-size: 11.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: none; background: var(--brand); color: #fff; cursor: pointer; }
  .mini-btn.ghost { background: none; color: var(--ink-soft); border: 1px solid var(--line); }

  .bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding: 10px 2px 0; overflow-x: auto; }
  .bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; width: 34px; cursor: pointer; }
  .bar-pair { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
  .bar-seg { width: 12px; border-radius: 4px 4px 0 0; }
  .bar-col-label { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--ink-soft); white-space: nowrap; }
  .chart-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--ink-soft); }
  .chart-legend span { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .line-chart-wrap { padding-top: 8px; }

  .fab { position: fixed; bottom: 26px; left: 50%; transform: translateX(calc(-50% + 190px)); width: 54px; height: 54px; border-radius: 50%; background: var(--brand); color: #fff; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(61,90,254,0.35); cursor: pointer; z-index: 15; }
  @media (min-width: 481px) { .fab { transform: translateX(190px); } }

  .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); max-width: 420px; width: calc(100% - 40px); background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
  .toast button { background: none; border: none; color: #8FA3FF; font-weight: 700; cursor: pointer; font-size: 12.5px; }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(20,22,31,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 22px 22px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; overflow-y: auto; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; margin: 0; }
  .icon-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 4px; }

  .type-toggle { display: flex; background: var(--surface); border-radius: 12px; overflow: hidden; margin-bottom: 16px; padding: 4px; gap: 4px; }
  .type-toggle button { flex: 1; padding: 9px 0; border: none; border-radius: 9px; background: transparent; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-soft); cursor: pointer; }
  .type-toggle button.active { background: var(--brand); color: #fff; }
  .type-toggle button:disabled { cursor: not-allowed; opacity: 0.6; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field span { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
  .field input, .field select { font-family: 'JetBrains Mono', monospace; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
  .field input:focus, .field select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }

  .submit { width: 100%; padding: 13px 0; border: none; border-radius: 12px; background: var(--brand); color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
</style>

const fmt = (n) => new Intl.NumberFormat("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(n || 0));
const monthLabel = (ym) => { const [y,m] = ym.split("-"); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString("en-MY", { month: "short", year: "numeric" }); };
const todayStr = () => new Date().toISOString().slice(0, 10);

/* ---------------- Storage (localStorage — per-browser, per-device) ---------------- */
const STORE_KEY = "ledger-data-v1";
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.error(e); }
  return null;
}
function saveStore(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch (e) { console.error(e); }
}

/* ---------------- App ---------------- */
function App() {
  const [expenses, setExpenses] = useState([]);
  const [incomes, setIncomes] = useState([]);
  const [budgets, setBudgets] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("log");
  const [entryType, setEntryType] = useState("expense");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [monthFilter, setMonthFilter] = useState("all");
  const [categoryFilter, setCategoryFilter] = useState(null);
  const [saveState, setSaveState] = useState("idle");
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    const data = loadStore();
    if (data) {
      setExpenses(data.expenses || []);
      setIncomes(data.incomes || []);
      setBudgets(data.budgets || {});
    } else {
      setExpenses(SEED_EXPENSES);
      setIncomes(SEED_INCOME);
    }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSaveState("saving");
    const t = setTimeout(() => { saveStore({ expenses, incomes, budgets }); setSaveState("saved"); }, 250);
    return () => clearTimeout(t);
  }, [expenses, incomes, budgets, loaded]);

  const showUndoToast = useCallback((kind, item) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ kind, item });
    toastTimer.current = setTimeout(() => setToast(null), 5000);
  }, []);

  const addExpense = useCallback((e) => setExpenses((prev) => [{ id: uid(), ...e }, ...prev]), []);
  const addIncome = useCallback((e) => setIncomes((prev) => [{ id: uid(), ...e }, ...prev]), []);
  const updateExpense = useCallback((id, patch) => setExpenses((prev) => prev.map((x) => x.id === id ? { ...x, ...patch } : x)), []);
  const updateIncome = useCallback((id, patch) => setIncomes((prev) => prev.map((x) => x.id === id ? { ...x, ...patch } : x)), []);

  const removeExpense = useCallback((id) => {
    setExpenses((prev) => { const item = prev.find((x) => x.id === id); if (item) showUndoToast("expense", item); return prev.filter((x) => x.id !== id); });
  }, [showUndoToast]);
  const removeIncome = useCallback((id) => {
    setIncomes((prev) => { const item = prev.find((x) => x.id === id); if (item) showUndoToast("income", item); return prev.filter((x) => x.id !== id); });
  }, [showUndoToast]);

  const undoDelete = useCallback(() => {
    if (!toast) return;
    if (toast.kind === "expense") setExpenses((prev) => [toast.item, ...prev]);
    else setIncomes((prev) => [toast.item, ...prev]);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(null);
  }, [toast]);

  const setBudget = useCallback((category, amount) => {
    setBudgets((prev) => { const next = { ...prev }; if (amount == null) delete next[category]; else next[category] = amount; return next; });
  }, []);

  const months = useMemo(() => {
    const set = new Set();
    expenses.forEach((e) => set.add(e.date.slice(0, 7)));
    incomes.forEach((e) => set.add(e.date.slice(0, 7)));
    return Array.from(set).sort().reverse();
  }, [expenses, incomes]);

  const filteredExpenses = useMemo(() => {
    let list = monthFilter === "all" ? expenses : expenses.filter((e) => e.date.slice(0, 7) === monthFilter);
    if (categoryFilter) list = list.filter((e) => e.category === categoryFilter);
    return list;
  }, [expenses, monthFilter, categoryFilter]);

  const filteredIncomes = useMemo(() => {
    if (categoryFilter) return [];
    return monthFilter === "all" ? incomes : incomes.filter((e) => e.date.slice(0, 7) === monthFilter);
  }, [incomes, monthFilter, categoryFilter]);

  const totalExpense = useMemo(() => filteredExpenses.reduce((s, e) => s + Number(e.amount || 0), 0), [filteredExpenses]);
  const totalIncome = useMemo(() => filteredIncomes.reduce((s, e) => s + Number(e.amount || 0), 0), [filteredIncomes]);
  const net = totalIncome - totalExpense;

  const allTimeBalance = useMemo(() => {
    const inc = incomes.reduce((s, e) => s + Number(e.amount || 0), 0);
    const exp = expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
    return inc - exp;
  }, [incomes, expenses]);

  const categoryBaseExpenses = useMemo(() => monthFilter === "all" ? expenses : expenses.filter((e) => e.date.slice(0, 7) === monthFilter), [expenses, monthFilter]);
  const categoryTotals = useMemo(() => {
    const map = {};
    categoryBaseExpenses.forEach((e) => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
    return Object.entries(map).map(([category, total]) => ({ category, total })).sort((a, b) => b.total - a.total);
  }, [categoryBaseExpenses]);

  const monthlyTrend = useMemo(() => {
    const map = {};
    expenses.forEach((e) => { const k = e.date.slice(0, 7); map[k] = map[k] || { month: k, income: 0, expense: 0 }; map[k].expense += Number(e.amount || 0); });
    incomes.forEach((e) => { const k = e.date.slice(0, 7); map[k] = map[k] || { month: k, income: 0, expense: 0 }; map[k].income += Number(e.amount || 0); });
    return Object.values(map).sort((a, b) => a.month.localeCompare(b.month)).map((r) => ({ ...r, label: monthLabel(r.month) }));
  }, [expenses, incomes]);

  const combinedLog = useMemo(() => {
    const a = filteredExpenses.map((e) => ({ ...e, kind: "expense" }));
    const b = filteredIncomes.map((e) => ({ ...e, kind: "income" }));
    return [...a, ...b].sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0));
  }, [filteredExpenses, filteredIncomes]);

  const openAdd = (type) => { setEditing(null); setEntryType(type); setShowForm(true); };
  const openEdit = (kind, id) => { setEditing({ kind, id }); setEntryType(kind); setShowForm(true); };
  const editingItem = useMemo(() => {
    if (!editing) return null;
    const list = editing.kind === "expense" ? expenses : incomes;
    return list.find((x) => x.id === editing.id) || null;
  }, [editing, expenses, incomes]);

  const filterByCategory = (cat) => { setCategoryFilter((prev) => prev === cat ? null : cat); setTab("log"); };
  const filterByMonth = (ym) => { setMonthFilter(ym); setTab("log"); };

  if (!loaded) return <div className="centered"><div className="loading-mark">RM</div></div>;

  return (
    <React.Fragment>
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark">RM</span>
          <div><h1>Ledger</h1><p className="sub">Daily money log</p></div>
        </div>
        <div className={`save-pill ${saveState}`}>{saveState === "saving" ? "saving…" : "saved"}</div>
      </header>

      <section className="balance-block">
        <div className="balance-main">
          <span className="label">Balance</span>
          <span className={`balance-figure ${allTimeBalance < 0 ? "neg" : ""}`}>RM {fmt(allTimeBalance)}</span>
        </div>
        <div className="balance-stats">
          <div className="stat income"><TrendUpIcon size={14}/><span>RM {fmt(totalIncome)}</span></div>
          <div className="stat expense"><TrendDownIcon size={14}/><span>RM {fmt(totalExpense)}</span></div>
          <div className={`stat net ${net < 0 ? "neg" : "pos"}`}><WalletIcon size={14}/><span>{net < 0 ? "-" : "+"}RM {fmt(net)}</span></div>
        </div>
      </section>

      <div className="month-scroll">
        <button className={`chip ${monthFilter === "all" ? "active" : ""}`} onClick={() => setMonthFilter("all")}>All time</button>
        {months.map((m) => <button key={m} className={`chip ${monthFilter === m ? "active" : ""}`} onClick={() => setMonthFilter(m)}>{monthLabel(m)}</button>)}
      </div>

      {categoryFilter && (
        <div className="filter-banner">
          <span>Category: <strong>{categoryFilter}</strong></span>
          <button onClick={() => setCategoryFilter(null)} aria-label="Clear category filter"><XIcon size={13}/></button>
        </div>
      )}

      <nav className="tabs">
        {[["log","Log"],["overview","Overview"]].map(([key,name]) => (
          <button key={key} className={`tab ${tab === key ? "active" : ""}`} onClick={() => setTab(key)}>{name}</button>
        ))}
      </nav>

      <main className="content">
        {tab === "log" && <LogView items={combinedLog} onRemoveExpense={removeExpense} onRemoveIncome={removeIncome} onEdit={openEdit} />}
        {tab === "overview" && (
          <OverviewView categoryTotals={categoryTotals} monthlyTrend={monthlyTrend} budgets={budgets}
            onSetBudget={setBudget} onFilterCategory={filterByCategory} onFilterMonth={filterByMonth} />
        )}
      </main>

      <button className="fab" onClick={() => openAdd("expense")} aria-label="Add entry"><PlusIcon size={22}/></button>

      {showForm && (
        <EntryForm entryType={entryType} setEntryType={setEntryType} initial={editingItem}
          onClose={() => { setShowForm(false); setEditing(null); }}
          onSubmitExpense={(data) => { if (editingItem) updateExpense(editingItem.id, data); else addExpense(data); setShowForm(false); setEditing(null); }}
          onSubmitIncome={(data) => { if (editingItem) updateIncome(editingItem.id, data); else addIncome(data); setShowForm(false); setEditing(null); }} />
      )}

      {toast && (
        <div className="toast">
          <span>Deleted RM {fmt(toast.item.amount)}{toast.kind === "expense" ? ` · ${toast.item.category}` : ` · ${toast.item.source}`}</span>
          <button onClick={undoDelete}>Undo</button>
        </div>
      )}
    </React.Fragment>
  );
}

function LogView({ items, onRemoveExpense, onRemoveIncome, onEdit }) {
  if (items.length === 0) return <p className="empty">No entries for this filter yet. Tap + to add one.</p>;
  const groups = [];
  let lastDate = null;
  items.forEach((it) => {
    if (it.date !== lastDate) { groups.push({ date: it.date, rows: [] }); lastDate = it.date; }
    groups[groups.length - 1].rows.push(it);
  });
  return (
    <div className="log">
      <p className="hint">Tap an entry to edit · swipe left to delete</p>
      {groups.map((g) => (
        <div key={g.date} className="day-group">
          <div className="day-heading">{new Date(g.date + "T00:00:00").toLocaleDateString("en-MY", { weekday: "short", day: "numeric", month: "short" })}</div>
          {g.rows.map((row) => (
            <LogRow key={row.id} row={row} onEdit={() => onEdit(row.kind, row.id)}
              onDelete={() => row.kind === "income" ? onRemoveIncome(row.id) : onRemoveExpense(row.id)} />
          ))}
        </div>
      ))}
    </div>
  );
}

function LogRow({ row, onEdit, onDelete }) {
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const start = useRef({ x: 0, y: 0 });
  const moved = useRef(false);
  const THRESH = -68;

  const onPointerDown = (e) => { start.current = { x: e.clientX, y: e.clientY }; moved.current = false; setDragging(true); };
  const onPointerMove = (e) => {
    if (!dragging) return;
    const dx = e.clientX - start.current.x, dy = e.clientY - start.current.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved.current = true;
    if (Math.abs(dx) > Math.abs(dy)) setDragX(Math.min(0, Math.max(dx, -100)));
  };
  const finish = () => {
    setDragging(false);
    if (dragX < THRESH) onDelete(); else if (!moved.current) onEdit();
    setDragX(0);
  };

  return (
    <div className="row-wrap">
      <div className="row-delete-bg"><TrashIcon size={16}/></div>
      <div className="row" style={{ transform: `translateX(${dragX}px)`, transition: dragging ? "none" : "transform 0.2s ease" }}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={finish} onPointerCancel={finish}>
        <span className="dot" style={{ background: row.kind === "income" ? "#5B7566" : toneFor(row.category) }} />
        <div className="row-main">
          <div className="row-top">
            <span className="row-title">{row.kind === "income" ? row.source : row.category}</span>
            <span className={`row-amount ${row.kind === "income" ? "pos" : ""}`}>{row.kind === "income" ? "+" : "−"}RM {fmt(row.amount)}</span>
          </div>
          {row.description ? <span className="row-desc">{row.description}</span> : null}
        </div>
        <button className="row-delete-btn" onClick={(e) => { e.stopPropagation(); onDelete(); }} aria-label="Delete entry"><TrashIcon size={14}/></button>
      </div>
    </div>
  );
}

function OverviewView({ categoryTotals, monthlyTrend, budgets, onSetBudget, onFilterCategory, onFilterMonth }) {
  const maxCat = Math.max(1, ...categoryTotals.map((c) => c.total));
  const [budgetEditing, setBudgetEditing] = useState(null);
  const [draft, setDraft] = useState("");

  const openBudgetEdit = (cat) => {
    if (budgetEditing === cat) { setBudgetEditing(null); return; }
    setBudgetEditing(cat); setDraft(budgets[cat] != null ? String(budgets[cat]) : "");
  };
  const saveBudget = (cat) => { const v = parseFloat(draft); onSetBudget(cat, v > 0 ? v : null); setBudgetEditing(null); };
  const clearBudget = (cat) => { onSetBudget(cat, null); setBudgetEditing(null); };

  const maxTrend = Math.max(1, ...monthlyTrend.map((m) => Math.max(m.income, m.expense)));

  return (
    <div className="overview">
      <section className="panel">
        <h2>By category</h2>
        <p className="panel-hint">Tap a bar to view those entries · tap the name to set a budget</p>
        {categoryTotals.length === 0 ? <p className="empty">Nothing spent this period.</p> : (
          <div className="cat-bars">
            {categoryTotals.map((c) => {
              const budget = budgets[c.category];
              const over = budget != null && c.total > budget;
              const nearLimit = budget != null && !over && c.total / budget >= 0.8;
              const fillColor = over ? "#A6503B" : nearLimit ? "#C9A227" : toneFor(c.category);
              return (
                <div className="cat-item" key={c.category}>
                  <div className="cat-row">
                    <button className="cat-name" onClick={() => openBudgetEdit(c.category)}>{c.category}<PencilIcon size={10}/></button>
                    <div className="cat-track" onClick={() => onFilterCategory(c.category)}>
                      <div className="cat-fill" style={{ width: `${Math.min(100, (c.total / maxCat) * 100)}%`, background: fillColor }} />
                    </div>
                    <span className="cat-total">RM {fmt(c.total)}</span>
                  </div>
                  {budget != null && (
                    <div className={`budget-line ${over ? "over" : nearLimit ? "warn" : ""}`}>
                      RM {fmt(c.total)} of RM {fmt(budget)} budget{over ? " — over" : nearLimit ? " — near limit" : ""}
                    </div>
                  )}
                  {budgetEditing === c.category && (
                    <div className="budget-editor">
                      <input type="number" inputMode="decimal" placeholder="Monthly budget (RM)" value={draft} onChange={(e) => setDraft(e.target.value)} autoFocus />
                      <button className="mini-btn" onClick={() => saveBudget(c.category)}>Save</button>
                      {budget != null && <button className="mini-btn ghost" onClick={() => clearBudget(c.category)}>Clear</button>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </section>

      <section className="panel">
        <h2>Monthly trend</h2>
        <p className="panel-hint">Tap a column to jump to that month's log</p>
        <div className="bar-chart">
          {monthlyTrend.map((m) => (
            <div className="bar-col" key={m.month} onClick={() => onFilterMonth(m.month)}>
              <div className="bar-pair">
                <div className="bar-seg" style={{ height: `${(m.income / maxTrend) * 140}px`, background: "#5B7566" }} title={`Income RM ${fmt(m.income)}`} />
                <div className="bar-seg" style={{ height: `${(m.expense / maxTrend) * 140}px`, background: "#A6503B" }} title={`Expense RM ${fmt(m.expense)}`} />
              </div>
              <span className="bar-col-label">{m.label.split(" ")[0]}</span>
            </div>
          ))}
        </div>
        <div className="chart-legend">
          <span><span className="legend-dot" style={{ background: "#5B7566" }}/>Income</span>
          <span><span className="legend-dot" style={{ background: "#A6503B" }}/>Expense</span>
        </div>
      </section>

      <section className="panel">
        <h2>Net balance over time</h2>
        <NetLineChart data={monthlyTrend.map((m) => ({ ...m, net: m.income - m.expense }))} />
      </section>
    </div>
  );
}

function NetLineChart({ data }) {
  if (data.length === 0) return <p className="empty">No data yet.</p>;
  const w = 320, h = 140, pad = 10;
  const values = data.map((d) => d.net);
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const range = max - min || 1;
  const stepX = data.length > 1 ? (w - pad * 2) / (data.length - 1) : 0;
  const points = data.map((d, i) => {
    const x = pad + i * stepX;
    const y = pad + (1 - (d.net - min) / range) * (h - pad * 2);
    return `${x},${y}`;
  });
  const zeroY = pad + (1 - (0 - min) / range) * (h - pad * 2);

  return (
    <div className="line-chart-wrap">
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} preserveAspectRatio="none">
        <line x1={pad} y1={zeroY} x2={w - pad} y2={zeroY} stroke="#E4DFD3" strokeDasharray="4 3" />
        <polyline points={points.join(" ")} fill="none" stroke="#C9A227" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round" />
        {data.map((d, i) => {
          const [x, y] = points[i].split(",").map(Number);
          return <circle key={d.month} cx={x} cy={y} r="3" fill="#C9A227" />;
        })}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9.5, color: "var(--ink-soft)", fontFamily: "IBM Plex Mono, monospace", marginTop: 2 }}>
        {data.map((d) => <span key={d.month}>{d.label.split(" ")[0]}</span>)}
      </div>
    </div>
  );
}

function EntryForm({ entryType, setEntryType, initial, onClose, onSubmitExpense, onSubmitIncome }) {
  const isEdit = !!initial;
  const [date, setDate] = useState(initial ? initial.date : todayStr());
  const [category, setCategory] = useState(initial && entryType === "expense" ? initial.category : CATEGORIES[0]);
  const [source, setSource] = useState(initial && entryType === "income" ? initial.source : INCOME_SOURCES[0]);
  const [amount, setAmount] = useState(initial ? String(initial.amount) : "");
  const [description, setDescription] = useState(initial ? initial.description || "" : "");

  const submit = () => {
    const amt = parseFloat(amount);
    if (!amt || amt <= 0 || !date) return;
    if (entryType === "expense") onSubmitExpense({ date, category, amount: amt, description: description.trim() });
    else onSubmitIncome({ date, source, amount: amt, description: description.trim() });
  };

  return (
    <div className="sheet-backdrop" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <h2>{isEdit ? "Edit entry" : "New entry"}</h2>
          <button className="icon-btn" onClick={onClose} aria-label="Close"><XIcon size={18}/></button>
        </div>
        <div className="type-toggle">
          <button className={entryType === "expense" ? "active" : ""} onClick={() => !isEdit && setEntryType("expense")} disabled={isEdit}>Expense</button>
          <button className={entryType === "income" ? "active" : ""} onClick={() => !isEdit && setEntryType("income")} disabled={isEdit}>Income</button>
        </div>
        <label className="field"><span>Date</span><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></label>
        <label className="field"><span>Amount (RM)</span><input type="number" inputMode="decimal" placeholder="0.00" value={amount} onChange={(e) => setAmount(e.target.value)} /></label>
        {entryType === "expense" ? (
          <label className="field"><span>Category</span>
            <select value={category} onChange={(e) => setCategory(e.target.value)}>
              {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </label>
        ) : (
          <label className="field"><span>Source</span>
            <select value={source} onChange={(e) => setSource(e.target.value)}>
              {INCOME_SOURCES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </label>
        )}
        <label className="field"><span>Note (optional)</span><input type="text" placeholder="e.g. Bazar Ramadan" value={description} onChange={(e) => setDescription(e.target.value)} /></label>
        <button className="submit" onClick={submit}>{isEdit ? "Save changes" : `Add ${entryType === "expense" ? "expense" : "income"}`}</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
